<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="20" fill="#0F172A"/>
  <!-- Timer Outer Ring -->
  <circle cx="50" cy="50" r="40" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Timer Ticks -->
  <line x1="50" y1="10" x2="50" y2="15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="50" x2="85" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="90" x2="50" y2="85" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="50" x2="15" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- First P (Pace) -->
  <path d="M35,35 L35,65 M35,35 L48,35 C53,35 55,38 55,42 C55,46 53,49 48,49 L35,49" fill="white"/>

  <!-- Second P (Pulse) -->
  <path d="M45,45 L45,75 M45,45 L58,45 C63,45 65,48 65,52 C65,56 63,59 58,59 L45,59" fill="#38bdf8"/>

  <!-- Pulse Line -->
  <path d="M50,70 L53,67 L57,73 L60,70" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
